def parse_multipart_file(headers: Dict[str, str], body: bytes, field_name: str = "paper") -> tuple[str, bytes]:
    """Parse a single uploaded file from multipart/form-data without cgi.

    Python 3.13 removed the cgi module, so Studio uses the stdlib email parser.
    """
    content_type = headers.get("content-type") or headers.get("Content-Type") or ""
    msg_bytes = (f"Content-Type: {content_type}\r\nMIME-Version: 1.0\r\n\r\n".encode("utf-8") + body)
    msg = BytesParser(policy=email_default_policy).parsebytes(msg_bytes)
    if not msg.is_multipart():
        raise ValueError("Expected multipart/form-data upload.")
    for part in msg.iter_parts():
        disp = part.get("Content-Disposition", "")
        params = dict(part.get_params(header="content-disposition") or [])
        if params.get("name") == field_name:
            filename = params.get("filename") or "paper.txt"
            payload = part.get_payload(decode=True) or b""
            return Path(filename).name, payload
    raise ValueError(f"Missing multipart file field: {field_name}")


class StudioServer(BaseHTTPRequestHandler):
    store: StudioStore
    private_key: Any = None
    issuer: str = "claimbench-edu-local"

    def _send_json(self, data: Dict[str, Any], status: int = 200) -> None:
        raw = json.dumps(data, indent=2, ensure_ascii=False).encode("utf-8")
        self.send_response(status)
        self.send_header("content-type", "application/json; charset=utf-8")
        self.send_header("content-length", str(len(raw)))
        self.end_headers()
        self.wfile.write(raw)

    def _send_text(self, text: str, content_type: str = "text/html; charset=utf-8", status: int = 200) -> None:
        raw = text.encode("utf-8")
        self.send_response(status)
        self.send_header("content-type", content_type)
        self.send_header("content-length", str(len(raw)))
        self.end_headers()
        self.wfile.write(raw)

    def _error(self, exc: Exception, status: int = 400) -> None:
        self._send_json({"error": str(exc), "trace": traceback.format_exc(limit=1)}, status=status)

    def do_GET(self) -> None:  # noqa: N802
        try:
            parsed = urlparse(self.path)
            path = parsed.path
            q = parse_qs(parsed.query)
            if path == "/":
                return self._send_text(HTML)
            if path == "/api/projects":
                return self._send_json({"projects": self.store.list_projects(), "exports": self.store.export_paths()})
            if path == "/api/project":
                pid = q.get("id", [""])[0]
                return self._send_json(self.store.load_project(pid))
            if path.startswith("/api/export/"):
                name = path.rsplit("/", 1)[-1]
                f = self.store.exports_dir / name
                if not f.exists() or f.suffix != ".jsonl":
                    raise FileNotFoundError(name)
                ctype = mimetypes.guess_type(str(f))[0] or "application/jsonl"
                raw = f.read_bytes()
                self.send_response(200)
                self.send_header("content-type", ctype)
                self.send_header("content-disposition", f"attachment; filename={name}")
                self.send_header("content-length", str(len(raw)))
                self.end_headers()
                self.wfile.write(raw)
                return
            self._send_json({"error": "not found"}, status=404)
        except Exception as exc:
            self._error(exc)

    def _read_json(self) -> Dict[str, Any]:
        length = int(self.headers.get("content-length", "0"))
        raw = self.rfile.read(length)
        return json.loads(raw.decode("utf-8") or "{}")

    def do_POST(self) -> None:  # noqa: N802
        try:
            parsed = urlparse(self.path)
            if parsed.path == "/api/upload":
                length = int(self.headers.get("content-length", "0"))
                body = self.rfile.read(length)
                filename, content = parse_multipart_file(dict(self.headers), body, field_name="paper")
                text, method = extract_text_from_upload(filename, content)
                claims = [c.__dict__ for c in propose_claims(text)]
                project = self.store.create_project(filename, content, text, method, claims)
                return self._send_json({"project": project})
            if parsed.path == "/api/add_claim":
                data = self._read_json()
                project = self.store.load_project(data["project_id"])
                statement = (data.get("statement") or "").strip()
                if not statement:
                    raise ValueError("Claim statement is required.")
                evidence = build_evidence_from_form(data)
                proposal = proposed_grade(statement, evidence, strictness=data.get("strictness", "strict_fairness"))
                claim_id = f"C{len(project.get('claims', [])) + 1}"
                claim = {
                    "id": claim_id,
                    "statement": statement,
                    "confidence": "manual",
                    "reason": "manual claim added in Studio",
                    "proposal": proposal,
                    "extraction_provenance": "human_verified",
                    "human_reviews": [],
                }
                project.setdefault("claims", []).append(claim)
                self.store.save_project(project)
                return self._send_json(project)
            if parsed.path == "/api/review":
                data = self._read_json()
                project = self.store.load_project(data["project_id"])
                claim = next((c for c in project.get("claims", []) if c.get("id") == data["claim_id"]), None)
                if not claim:
                    raise KeyError(data["claim_id"])
                proposal = claim.get("proposal", {})
                action = data.get("action", "certify")
                human_verdict = data.get("human_verdict") or proposal.get("verdict", "evidentiary_inconclusive")
                if action == "certify":
                    human_verdict = proposal.get("verdict", human_verdict)
                    review_status = "single_reviewer_label"
                elif action == "override":
                    review_status = "single_reviewer_label"
                elif action == "needs_panel_review":
                    review_status = "needs_panel_review"
                elif action == "disputed":
                    review_status = "disputed"
                else:
                    review_status = "needs_panel_review"

                record = make_record(project, claim)
                review = {
                    "reviewed_at": now_iso(),
                    "reviewer_id": data.get("reviewer_id", "reviewer_001"),
                    "action": action,
                    "human_verdict": human_verdict,
                    "review_status": review_status,
                    "dataset_split": data.get("dataset_split", "training"),
                    "rationale": data.get("rationale", ""),
                    "reason_codes": data.get("reason_codes", []),
                    "labeled_by_model": False,
                }
                claim.setdefault("human_reviews", []).append(review)

                artifact_core = {
                    "schema": "claimbench_edu.adjudication_artifact.v0.1",
                    "project_id": project["id"],
                    "record_id": claim["id"],
                    "paper_sha256": project.get("source_sha256"),
                    "claim_statement": claim.get("statement"),
                    "machine_proposal": proposal,
                    "human_decision": review,
                    "paper_record": record,
                    "trust_boundary": "human_label_is_ground_truth_candidate; machine_proposal_is_not_ground_truth",
                }
                artifact: Dict[str, Any] = {"artifact_core": artifact_core, "signatures": []}
                if self.private_key is not None and make_signature_envelope is not None:
                    artifact["signatures"].append(make_signature_envelope(artifact_core, self.private_key, issuer=self.issuer, signed_payload="adjudication_artifact_core"))
                else:
                    artifact["signature_status"] = "unsigned_local_academic_artifact"
                path = self.store.write_adjudication_artifact(artifact)
                review["artifact_path"] = str(path.relative_to(self.store.root))

                # RLHF training row: always useful as feedback, but not automatically truth.
                rlhf_row = {
                    "schema": "claimbench_edu.rlhf_feedback.v0.1",
                    "project_id": project["id"],
                    "record_id": claim["id"],
                    "input_claim": claim.get("statement"),
                    "machine_proposal": proposal,
                    "human_decision": review,
                    "reason_codes": review["reason_codes"],
                    "paper_sha256": project.get("source_sha256"),
                }
                self.store.append_export("rlhf_training.jsonl", rlhf_row)
                export_file = "rlhf_training.jsonl"

                label_row = {
                    "record_id": claim["id"],
                    "verdict": human_verdict,
                    "claim_class": proposal.get("claim_class", "comparative_empirical"),
                    "rationale": review.get("rationale", ""),
                    "confidence": "medium",
                    "reviewer_id": review["reviewer_id"],
                    "review_status": review_status,
                    "labeled_by_model": False,
                    "source_project_id": project["id"],
                    "artifact_path": review["artifact_path"],
                }
                split = review["dataset_split"]
                if split == "validation" and review_status == "single_reviewer_label":
                    self.store.append_export("validation_labels.jsonl", label_row)
                    export_file += " + validation_labels.jsonl"
                elif split == "panel":
                    label_row["review_status"] = "panel_confirmed_label" if review_status == "single_reviewer_label" else review_status
                    self.store.append_export("panel_labels.jsonl", label_row)
                    export_file += " + panel_labels.jsonl"
                elif split == "disputed" or review_status == "disputed":
                    self.store.append_export("disputed_labels.jsonl", label_row)
                    export_file += " + disputed_labels.jsonl"
                elif split == "do_not_use":
                    self.store.append_export("do_not_use.jsonl", rlhf_row)
                    export_file += " + do_not_use.jsonl"

                self.store.save_project(project)
                return self._send_json({"project": project, "artifact_path": review["artifact_path"], "export_file": export_file})
            self._send_json({"error": "not found"}, status=404)
        except Exception as exc:
            self._error(exc)


def run_server(workspace: str, host: str = "127.0.0.1", port: int = 8765, sign_private_key: Optional[str] = None, issuer: str = "claimbench-edu-local") -> None:
    store = StudioStore(workspace)
    handler = StudioServer
    handler.store = store
    handler.issuer = issuer
    if sign_private_key:
        if load_private_key is None:
            raise RuntimeError("claimbench.crypto is unavailable; cannot sign artifacts.")
        handler.private_key = load_private_key(sign_private_key)
    else:
        handler.private_key = None
    server = ThreadingHTTPServer((host, port), handler)
    print(f"ClaimBench Edu Studio running at http://{host}:{port}")
    print(f"Workspace: {store.root}")
    print("Press Ctrl+C to stop.")
    server.serve_forever()


def main(argv: Optional[list[str]] = None) -> int:
    ap = argparse.ArgumentParser(description="Run ClaimBench Edu Studio local web UI")
    ap.add_argument("--workspace", default="claimbench_edu_workspace")
    ap.add_argument("--host", default="127.0.0.1")
    ap.add_argument("--port", type=int, default=8765)
    ap.add_argument("--sign-private-key", help="Optional Ed25519 private key PEM for adjudication artifact signatures")
    ap.add_argument("--issuer", default="claimbench-edu-local")
    args = ap.parse_args(argv)
    run_server(args.workspace, args.host, args.port, args.sign_private_key, args.issuer)
    return 0


if __name__ == "__main__":
    raise SystemExit(main())
